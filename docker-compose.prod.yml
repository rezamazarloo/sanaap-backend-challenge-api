services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      app_ws:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "80:80"
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCUMENT_LOCAL_STORAGE: "${DOCUMENT_LOCAL_STORAGE:-local_uploads}"
    image: sanaap-dms-api:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?RABBITMQ_USER is required}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
      RABBITMQ_PORT: "5672"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL_DB: "${REDIS_CHANNEL_DB:-0}"
      DOCUMENT_LOCAL_STORAGE: "${DOCUMENT_LOCAL_STORAGE:-local_uploads}"
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-localhost:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:-documents}"
      MINIO_SECURE: "False"
      MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE:-False}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
      MINIO_PRESIGNED_URL_EXPIRATION: "${MINIO_PRESIGNED_URL_EXPIRATION:-300}"
      DOCUMENT_LOG_LEVEL: "${DOCUMENT_LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - document_prod_local_storage:/app/dms/${DOCUMENT_LOCAL_STORAGE:-local_uploads}
    networks:
      - backend

  app_ws:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCUMENT_LOCAL_STORAGE: "${DOCUMENT_LOCAL_STORAGE:-local_uploads}"
    image: sanaap-dms-api:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?RABBITMQ_USER is required}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
      RABBITMQ_PORT: "5672"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL_DB: "${REDIS_CHANNEL_DB:-0}"
      DOCUMENT_LOCAL_STORAGE: "${DOCUMENT_LOCAL_STORAGE:-local_uploads}"
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-localhost:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:-documents}"
      MINIO_SECURE: "False"
      MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE:-False}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
      MINIO_PRESIGNED_URL_EXPIRATION: "${MINIO_PRESIGNED_URL_EXPIRATION:-300}"
      DOCUMENT_LOG_LEVEL: "${DOCUMENT_LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    networks:
      - backend

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCUMENT_LOCAL_STORAGE: "${DOCUMENT_LOCAL_STORAGE:-local_uploads}"
    image: sanaap-dms-api:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?RABBITMQ_USER is required}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
      RABBITMQ_PORT: "5672"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL_DB: "${REDIS_CHANNEL_DB:-0}"
      DOCUMENT_LOCAL_STORAGE: "${DOCUMENT_LOCAL_STORAGE:-local_uploads}"
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-localhost:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:-documents}"
      MINIO_SECURE: "False"
      MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE:-False}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
      MINIO_PRESIGNED_URL_EXPIRATION: "${MINIO_PRESIGNED_URL_EXPIRATION:-300}"
      DOCUMENT_LOG_LEVEL: "${DOCUMENT_LOG_LEVEL:-INFO}"
    depends_on:
      app:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - document_prod_local_storage:/app/dms/${DOCUMENT_LOCAL_STORAGE:-local_uploads}
    command: celery -A config.celery worker --loglevel=info
    networks:
      - backend

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCUMENT_LOCAL_STORAGE: "${DOCUMENT_LOCAL_STORAGE:-local_uploads}"
    image: sanaap-dms-api:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?RABBITMQ_USER is required}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
      RABBITMQ_PORT: "5672"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL_DB: "${REDIS_CHANNEL_DB:-0}"
      DOCUMENT_LOCAL_STORAGE: "${DOCUMENT_LOCAL_STORAGE:-local_uploads}"
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-localhost:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:-documents}"
      MINIO_SECURE: "False"
      MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE:-False}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
      MINIO_PRESIGNED_URL_EXPIRATION: "${MINIO_PRESIGNED_URL_EXPIRATION:-300}"
      DOCUMENT_LOG_LEVEL: "${DOCUMENT_LOG_LEVEL:-INFO}"
    depends_on:
      app:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document_prod_local_storage:/app/dms/${DOCUMENT_LOCAL_STORAGE:-local_uploads}
    command: celery -A config.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    networks:
      - backend

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?RABBITMQ_USER is required}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    command: server --address ':9000' --console-address ':9001' /data
    volumes:
      - minio_prod_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  document_prod_local_storage:
  postgres_prod_data:
  rabbitmq_prod_data:
  redis_prod_data:
  minio_prod_data:
